# Builds the ESP-Claw firmware for the custom COM2 board
# (ESP32-S3 with 16MB Flash + Quad PSRAM)
#
# After fork: go to Actions tab, enable this workflow,
# then click "Run workflow" → "Build" to compile.
# Download the firmware .bin files from the workflow artifacts.

name: Build COM2 Board

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'application/edge_agent/**'
      - 'components/**'
      - '.github/workflows/build-com2-board.yml'

env:
  # ESP-IDF release version (matches project's CI recommendation)
  IDF_RELEASE_VERSION: release-v5.5

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:${IDF_RELEASE_VERSION}

    defaults:
      run:
        shell: bash
        working-directory: /workspace/application/edge_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: /workspace

      - name: Install esp-bmgr-assist
        run: |
          pip install esp-bmgr-assist

      - name: Generate board support files (com2_board)
        run: |
          idf.py bmgr -c ./boards -b com2_board
        env:
          # Board path is boards/community/com2_board/
          # The -c ./boards flag sets the boards root directory
          # The -b com2_board flag selects the specific board
          IDF_BOARD_MANAGER: "1"

      - name: Configure partition table for 16MB
        run: |
          # Ensure the partition table config is set for 16MB flash
          echo "CONFIG_PARTITION_TABLE_CUSTOM=y" >> sdkconfig
          echo "CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions_16MB.csv\"" >> sdkconfig
          # Also verify sdkconfig matches our board defaults
          idf.py reconfigure

      - name: Build firmware
        run: |
          idf.py build

      - name: Collect firmware artifacts
        run: |
          mkdir -p /workspace/firmware_output
          cp build/edge_agent.bin /workspace/firmware_output/
          cp build/bootloader/bootloader.bin /workspace/firmware_output/
          cp build/partition_table/partition-table.bin /workspace/firmware_output/
          cp build/*.bin /workspace/firmware_output/ 2>/dev/null || true
          cp build/flasher_args.json /workspace/firmware_output/
          cp build/flash_args /workspace/firmware_output/
          cp build/flash_project_args /workspace/firmware_output/
          cp build/bootloader/*.bin /workspace/firmware_output/ 2>/dev/null || true
          cp build/partition_table/*.bin /workspace/firmware_output/ 2>/dev/null || true
          ls -la /workspace/firmware_output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: com2-board-firmware
          path: /workspace/firmware_output/
          retention-days: 30