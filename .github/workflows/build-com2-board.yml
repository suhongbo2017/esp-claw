# Builds the ESP-Claw firmware for the custom COM2 board
# (ESP32-S3 with 16MB Flash + Quad PSRAM)
#
# After fork: go to Actions tab, enable this workflow,
# then click "Run workflow" → "Build" to compile.
# Download the firmware .bin files from the workflow artifacts.

name: Build COM2 Board

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'application/edge_agent/**'
      - 'components/**'
      - '.github/workflows/build-com2-board.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Using ESP-IDF v5.5 (matches project's CI recommendation)
      image: espressif/idf:release-v5.5

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/application/edge_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install esp-bmgr-assist
        run: |
          python -m pip install esp-bmgr-assist

      - name: Generate board support files (com2_board)
        run: |
          idf.py bmgr -c ./boards -b com2_board

      - name: Build firmware
        run: |
          idf.py build

      - name: Collect firmware artifacts
        run: |
          mkdir -p ${{ github.workspace }}/firmware_output
          cp build/edge_agent.bin ${{ github.workspace }}/firmware_output/
          cp build/bootloader/bootloader.bin ${{ github.workspace }}/firmware_output/
          cp build/partition_table/partition-table.bin ${{ github.workspace }}/firmware_output/
          cp build/*.bin ${{ github.workspace }}/firmware_output/ 2>/dev/null || true
          cp build/flasher_args.json ${{ github.workspace }}/firmware_output/
          cp build/flash_args ${{ github.workspace }}/firmware_output/
          cp build/flash_project_args ${{ github.workspace }}/firmware_output/
          cp build/bootloader/*.bin ${{ github.workspace }}/firmware_output/ 2>/dev/null || true
          cp build/partition_table/*.bin ${{ github.workspace }}/firmware_output/ 2>/dev/null || true
          ls -la ${{ github.workspace }}/firmware_output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: com2-board-firmware
          path: ${{ github.workspace }}/firmware_output/
          retention-days: 30