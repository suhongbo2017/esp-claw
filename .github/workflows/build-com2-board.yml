# Builds the ESP-Claw firmware for the custom COM2 board
# (ESP32-S3 with 16MB Flash + Quad PSRAM)

name: Build COM2 Board

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'application/edge_agent/**'
      - 'components/**'
      - '.github/workflows/build-com2-board.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:release-v5.5

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/application/edge_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          set -e

          # 1. Activate IDF environment (sets PATH, IDF_PATH, etc.)
          source /opt/esp/idf/export.sh

          # 2. Install board manager CLI helper
          pip install esp-bmgr-assist

          # 3. Generate board support files (gen_bmgr_codes/)
          idf.py bmgr -c ./boards -b com2_board

          # 4. Resolve dependencies and generate sdkconfig
          idf.py reconfigure

          # 5. Build the firmware
          idf.py build

      - name: Collect firmware artifacts
        run: |
          mkdir -p build/firmware
          cp build/edge_agent.bin               build/firmware/
          cp build/bootloader/bootloader.bin    build/firmware/
          cp build/partition_table/partition-table.bin build/firmware/
          cp build/flasher_args.json            build/firmware/
          cp build/flash_args                   build/firmware/
          cp build/flash_project_args           build/firmware/
          ls -laR build/firmware/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: com2-board-firmware
          path: application/edge_agent/build/firmware/
          retention-days: 30