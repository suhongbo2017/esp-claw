version: 1.0.0
# Devices Configuration for COM2 Board
devices:
  # USB UVC Camera (external USB camera)
  - name: camera
    type: custom
    version: default
    dependencies:
      espressif/usb_host_uvc: "2.4.2"

  # PDM Microphone (bare PDM mic, no I2C codec IC).
  # ST7735S display is handled directly in setup_device.c as a custom device.
  # (No built-in driver exists in ESP-IDF for ST7735S.)
  - name: audio_adc
    chip: internal
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      dac_enabled: false
      adc_max_channel: 1
      adc_channel_mask: "1"
      adc_init_gain: 0
    peripherals:
      - name: i2s_audio_in

  # I2C Master (for peripherals)
  - name: i2c_master
    chip: internal
    type: custom
    version: 1.0.0
    init_skip: true
    peripherals:
      - name: i2c_master
