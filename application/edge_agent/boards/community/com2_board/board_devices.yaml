  #     swap_xy: true
  #     invert_color: false
  #     x_max: 128
  #     y_max: 160
  #     io_spi_config:
  #       cs_gpio_num: 21
  #       dc_gpio_num: 16
  #       spi_mode: 0
  #       pclk_hz: 24000000
  #     lcd_panel_config:
  #       reset_gpio_num: 15
  #       data_endian: "LCD_RGB_DATA_ENDIAN_BIG"
  #       flags:
  #         reset_active_high: true
  #       vendor_config: NULL
  #   peripherals:
  #     - name: spi_display

  # I2C Master (for peripherals)
  - name: i2c_master
    chip: internal
    type: custom
    version: 1.0.0
    init_skip: true
    peripherals:
      - name: i2c_master