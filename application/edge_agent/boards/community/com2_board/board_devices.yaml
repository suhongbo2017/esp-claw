version: 1.0.0
# Devices Configuration for COM2 Board
devices:
  # USB UVC Camera (external USB camera)
  - name: camera
    type: custom
    version: default
    dependencies:
      espressif/usb_host_uvc: "2.4.2"

  # PDM Microphone (bare PDM mic, no I2C codec IC)
  - name: audio_adc
    chip: internal
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      dac_enabled: false
      adc_max_channel: 1
      adc_channel_mask: "1"
      adc_init_gain: 0
    peripherals:
      - name: i2s_audio_in

  # SPI Display (ST7735S 1.77" 128x160) - TODO: add st7735 driver to board manager
  # - name: display_lcd
  #   chip: st7735
  #   type: display_lcd
  #   sub_type: spi
  #   version: default
  #   config:
  #     mirror_x: false
